services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      # PostgreSQL requires POSTGRES_* names during first-time initialization.
      # They are deliberately derived from the application's single DB_* source
      # of truth instead of exposing duplicate administrator settings.
      POSTGRES_DB: "${DB_NAME}"
      POSTGRES_USER: "${DB_USER}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/001-schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"${DB_USER}\" -d \"${DB_NAME}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  app:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8080}:80"

  cleanup:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    env_file:
      - .env
    command: >-
      sh -c 'while true; do
      php /var/www/html/bin/cleanup.php;
      sleep "$${CLEANUP_INTERVAL_SECONDS:-300}";
      done'

volumes:
  postgres-data:
