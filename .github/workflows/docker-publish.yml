name: Build and Publish Docker Image

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/cobay-uc/ephempaste

jobs:
  build-production:
    name: Build Production Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Generate build version
        id: version
        shell: bash
        run: |
          export TZ="America/Edmonton"

          BUILD_VERSION="$(date +'%Y%m%d.%H')"

          echo "version=${BUILD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=build-${BUILD_VERSION}" >> "$GITHUB_OUTPUT"

          echo "Build version: build-${BUILD_VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}