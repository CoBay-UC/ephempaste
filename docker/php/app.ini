; Application-oriented PHP defaults for the container.
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
memory_limit = 128M
post_max_size = 64K
upload_max_filesize = 64K
max_execution_time = 30

; Session hardening. cookie_secure is selected at runtime based on APP_BASE_URL,
; allowing local HTTP development while enabling Secure cookies behind HTTPS.
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
