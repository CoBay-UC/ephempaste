server {
    listen 80;
    listen [::]:80;

    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;
    server_tokens off;

    # Send Nginx logs to Docker so operational failures are visible through
    # `docker compose logs` rather than being hidden inside the container.
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Paste bodies are small, but leave sufficient room for form overhead.
    client_max_body_size 64k;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_pass 127.0.0.1:9000;
    }

    # Prevent access to hidden files if one is ever placed in the public tree.
    location ~ /\. {
        deny all;
    }

    # Serve the installable web-app manifest with the correct content type.
    location = /site.webmanifest {
        default_type application/manifest+json;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Cache static assets briefly. Application responses explicitly use no-store.
    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
}
